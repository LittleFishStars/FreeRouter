    <h1>前端未构建</h1>
    <p>这个二进制在没有嵌入前端的情况下构建（默认 <code>go build ./...</code>）。</p>
    <p>要得到内嵌控制台的单二进制，按以下顺序构建：</p>
    <ol>
      <li><code>cd web &amp;&amp; pnpm install --store-dir .pnpm-store</code></li>
      <li><code>pnpm build</code>（产物写入 <code>internal/webui/dist/</code>）</li>
      <li>回到仓库根：<code>go build -tags webui_dist -o bin/freerouter ./cmd/freerouter</code></li>
    </ol>
    <p>详见 <code>internal/webui/README.md</code>。</p>
  </body>
